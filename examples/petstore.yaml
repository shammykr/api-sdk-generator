openapi: 3.0.3
info:
  title: Petstore API
  version: 1.2.0
  description: |
    A sample pet store API used to demonstrate api-sdk-generator.
    It exercises enums, nested objects, oneOf/anyOf unions, allOf
    composition, maps, path/query/header parameters and typed errors.
servers:
  - url: https://{environment}.petstore.example.com/v1
    variables:
      environment:
        default: api
        enum: [api, sandbox]
tags:
  - name: pets
  - name: owners
  - name: store

paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      description: Returns a page of pets, optionally filtered by status and species.
      tags: [pets]
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return (1-100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: Opaque cursor returned by a previous call.
          schema: { type: string }
        - name: status
          in: query
          description: Only return pets with this status.
          schema: { $ref: "#/components/schemas/PetStatus" }
        - name: species
          in: query
          description: Only return pets of these species.
          schema:
            type: array
            items: { type: string, enum: [dog, cat, bird] }
      responses:
        "200":
          description: A page of pets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PetPage" }
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createPet
      summary: Create a pet
      tags: [pets]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPet" }
      responses:
        "201":
          description: The created pet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "422":
          description: The request body failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        default:
          $ref: "#/components/responses/ErrorResponse"

  /pets/{petId}:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      operationId: getPet
      summary: Get a pet by id
      tags: [pets]
      responses:
        "200":
          description: The pet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "404":
          description: Pet not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: updatePet
      summary: Update a pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                status: { $ref: "#/components/schemas/PetStatus" }
                tags:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: The updated pet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "404":
          description: Pet not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deletePet
      summary: Delete a pet
      tags: [pets]
      deprecated: true
      responses:
        "204":
          description: Deleted.
        "404":
          description: Pet not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /pets/search:
    get:
      operationId: searchPets
      summary: Full-text search across pets and owners
      tags: [pets]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Matching results; each item is either a pet or an owner.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SearchResult" }

  /owners/{ownerId}:
    get:
      operationId: getOwner
      summary: Get an owner and their address
      tags: [owners]
      parameters:
        - name: ownerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Request-Id
          in: header
          description: Optional correlation id echoed back by the server.
          schema: { type: string }
      responses:
        "200":
          description: The owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Owner" }
        "404":
          description: Owner not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /store/inventory:
    get:
      operationId: getInventory
      summary: Pet counts by status
      tags: [store]
      responses:
        "200":
          description: A map of status to count.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer }

components:
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      description: The pet's numeric id.
      schema: { type: integer, format: int64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Makes retries of the same create request safe.
      schema: { type: string }

  responses:
    ErrorResponse:
      description: Unexpected error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    PetStatus:
      type: string
      description: Lifecycle status of a pet in the store.
      enum: [available, pending, adopted]

    BasePet:
      type: object
      required: [name, species]
      properties:
        name: { type: string, description: Display name. }
        species: { type: string, enum: [dog, cat, bird] }
        status: { $ref: "#/components/schemas/PetStatus" }
        tags:
          type: array
          items: { type: string }
        birthDate: { type: string, format: date, nullable: true }

    NewPet:
      description: Payload for creating a pet. `details` is species specific.
      allOf:
        - $ref: "#/components/schemas/BasePet"
        - type: object
          properties:
            details: { $ref: "#/components/schemas/PetDetails" }
            ownerId: { type: string, format: uuid }

    Pet:
      allOf:
        - $ref: "#/components/schemas/BasePet"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
            details: { $ref: "#/components/schemas/PetDetails" }
            owner: { $ref: "#/components/schemas/Owner" }
            medical:
              type: object
              description: Nested inline object, hoisted to its own type.
              properties:
                vaccinated: { type: boolean }
                weightKg: { type: number, format: float }
                allergies:
                  type: array
                  items:
                    type: object
                    required: [substance]
                    properties:
                      substance: { type: string }
                      severity: { type: string, enum: [mild, moderate, severe] }
            attributes:
              type: object
              description: Free-form string attributes.
              additionalProperties: { type: string }

    PetDetails:
      description: Species-specific details (a discriminated union).
      oneOf:
        - $ref: "#/components/schemas/DogDetails"
        - $ref: "#/components/schemas/CatDetails"
        - $ref: "#/components/schemas/BirdDetails"
      discriminator:
        propertyName: kind

    DogDetails:
      type: object
      required: [kind, breed]
      properties:
        kind: { type: string, enum: [dog] }
        breed: { type: string }
        goodWithKids: { type: boolean }

    CatDetails:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [cat] }
        indoor: { type: boolean }
        livesRemaining: { type: integer, minimum: 0, maximum: 9 }

    BirdDetails:
      type: object
      required: [kind, canTalk]
      properties:
        kind: { type: string, enum: [bird] }
        canTalk: { type: boolean }
        wingspanCm: { type: number }

    Owner:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        address:
          type: object
          properties:
            line1: { type: string }
            city: { type: string }
            country: { type: string, description: ISO 3166-1 alpha-2 code. }
            geo:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
        contact:
          description: Preferred contact; either a phone number or an email address.
          anyOf:
            - type: string
            - type: object
              title: PhoneContact
              required: [phone]
              properties:
                phone: { type: string }
                smsOptIn: { type: boolean }

    SearchResult:
      anyOf:
        - $ref: "#/components/schemas/Pet"
        - $ref: "#/components/schemas/Owner"

    PetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Pet" }
        nextCursor: { type: string, nullable: true }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }

    ValidationError:
      type: object
      required: [message, fields]
      properties:
        message: { type: string }
        fields:
          type: array
          items:
            type: object
            required: [field, reason]
            properties:
              field: { type: string }
              reason: { type: string }
